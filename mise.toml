min_version = "2026.9.1"

[tools]
node = "26.8.1"
bun = "1.4.0"
lefthook = "2.1.12"
actionlint = "1.7.12"
conftest = "0.69.0"
buf = "1.72.0"
gitleaks = "8.30.0"

[settings]
experimental = true
lockfile = true
env_cache = true
env_cache_ttl = "4h"
fetch_remote_versions_cache = "12h"

[env]
_.path = { path = ["{{config_root}}/node_modules/.bin"], tools = true }

[deps.bun]
auto = true
run = "bun install --frozen-lockfile"

[hooks]
postinstall = "lefthook install"

[tasks.gen]
description = "Generate the selected Cursor protobuf closure"
sources = ["proto/**/*.proto", "buf.gen.yaml", "buf.yaml"]
outputs = [
  "src/gen/agent/v1/catalog_pb.ts",
  "src/gen/aiserver/v1/catalog_pb.ts",
  "src/gen/aiserver/v1/inference_pb.ts",
]
env = { NODE_OPTIONS = "--disable-warning=ExperimentalWarning" }
run = "buf generate"

[tasks.lint]
description = "Run Biome, oxlint, actionlint, and release policy"
depends = ["gen", "lint:biome", "lint:oxlint", "lint:actions", "lint:conftest"]

[tasks."lint:biome"]
hide = true
run = "biome check ."

[tasks."lint:oxlint"]
hide = true
depends = ["gen"]
run = "bun --bun oxlint"

[tasks."lint:actions"]
hide = true
run = "actionlint"

[tasks."lint:conftest"]
hide = true
run = [
  "conftest verify",
  "conftest test --all-namespaces .github/workflows/*.yml",
]

[tasks."lint:fix"]
description = "Apply Biome and oxlint fixes"
depends = ["gen"]
run = ["biome check --write .", "bun --bun oxlint --fix"]

[tasks.format]
description = "Format repository files"
run = "biome format --write ."

[tasks.typecheck]
description = "Type-check source and tests"
depends = ["gen"]
run = "tsc --noEmit -p tsconfig.json"

[tasks.deps]
description = "Check dependencies and dead exports"
depends = ["gen"]
run = "knip --no-progress"

[tasks."test:unit"]
description = "Run deterministic unit and protocol tests"
depends = ["gen"]
run = "bun test test/unit"

[tasks."test:live"]
description = "LIVE: run bounded Cursor multi-turn, host-tool, continuation, and resume proof"
depends = ["build"]
env = { OPENCODE_CURSOR_LIVE = "1" }
run = "bun test test/live"

[tasks.build]
description = "Build and validate provider and hybrid plugin entries"
depends = ["gen"]
sources = ["src/**/*.ts", "tsconfig.json", "tsconfig.build.json", "tsdown.config.ts", "package.json"]
outputs = [
  "dist/index.mjs",
  "dist/index.d.mts",
  "dist/lifecycle.mjs",
  "dist/plugin.mjs",
  "dist/plugin.d.mts",
]
run = "tsdown"

[tasks.pack]
description = "Dry-run package contents"
run = "bun pm pack --dry-run"

[tasks."pack:verify"]
description = "Verify the packed whitelist, artifact boundaries, and public exports"
depends = ["build"]
run = "bun scripts/pack-verify.ts"

[tasks."audit:secrets"]
description = "Scan the working tree and complete Git history for credentials"
run = [
  "gitleaks dir --redact --no-banner",
  "gitleaks git --redact --no-banner",
]

[tasks."hooks:secrets:staged"]
description = "Scan the staged diff for credentials"
run = "gitleaks git --staged --redact --no-banner"

[tasks.smoke]
description = "Run isolated OpenCode smoke without Cursor network calls"
depends = ["build"]
run = "bun scripts/smoke.ts"

[tasks.verify]
description = "Run CI-safe checks, then build, packed-artifact proof, and isolated smoke"
depends = ["lint", "typecheck", "deps", "test:unit", "audit:secrets"]
run = [{ task = "build" }, { task = "pack:verify" }, { task = "smoke" }]

[tasks.commitlint]
description = "Validate a commit message"
run = "commitlint --edit"

[tasks."changeset:status"]
description = "Check pending changesets against main"
run = "changeset status --since=origin/main"

[tasks.version]
description = "Generate Changesets version PR changes"
run = ["changeset version", "bun install --lockfile-only"]

[tasks."lockfile:sync"]
description = "Verify bun.lock matches package.json"
run = "bun install --frozen-lockfile --dry-run"
