name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The queue tests each entry on top of the ones ahead of it, so a push to
  # main has already passed and runs nothing.
  merge_group:
  # A merge_group run saves its cache on its queue branch, which no pull
  # request can restore from, so the daily refresh job dispatches this
  # workflow on main, whose run saves the cache pull requests restore from.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  MISE_ENV: ci
  MISE_IGNORED_CONFIG_PATHS: ~/.config/mise/config.toml

jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call: a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main
  verify:
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    env:
      PI_CURSOR_PACKAGES_TOKEN: ${{ github.token }}
    steps:
      - name: Set up mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          install: false
          cache: true

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install mise tools
        run: mise install --locked

      - name: Verify repository
        run: mise run verify

      - name: Changeset status
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: mise run changeset:status
