pre-commit:
  skip:
    - run: test -n "$CI"
  commands:
    format:
      glob: '{,**/}*.{ts,js,mjs,json,jsonc,md,yml,yaml}'
      run: mise run format -- {staged_files}
    lint:
      run: mise run lint
    typecheck:
      run: mise run typecheck

commit-msg:
  skip:
    - run: test -n "$CI"
  commands:
    commitlint:
      run: mise run commitlint -- {1}

pre-push:
  skip:
    - run: test -n "$CI"
  commands:
    lockfile-sync:
      run: mise run --no-deps lockfile:sync
    verify:
      run: mise run verify
